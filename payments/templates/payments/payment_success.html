<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow text-center p-4">
                    <h2 class="text-success">✅ Payment Successful!</h2>
                    <p class="mt-3">A receipt has been generated and displayed in the console.</p>
                    <div class="mt-4">
                        <a href="{% url 'make_payment' %}" class="btn btn-primary">Make Another Payment</a>
                        <a href="{% url 'dashboard' %}" class="btn btn-secondary ms-2">Go to Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
