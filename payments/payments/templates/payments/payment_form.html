<form method="post">
  {% csrf_token %}
  <input name="student_name" placeholder="Full Name" required>
  <input name="student_id" placeholder="Student ID (username)" required>
  <input name="vehicle_type" placeholder="Bus/Minibus" required>
  <input name="amount" value="500" required>
  <input type="email" name="email" placeholder="Your email" required>
  <button type="submit">Pay Now</button>
</form>
