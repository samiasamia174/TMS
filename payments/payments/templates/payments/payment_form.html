<!-- TMS/payments/templates/payments/payment_form.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Make Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Make Payment for University Transport</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <!-- Simple form for demo -->
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <input name="student_name" class="form-control" placeholder="Full Name" required>
        </div>
        <div class="mb-3">
            <input name="student_id" class="form-control" placeholder="Student ID (must match registered username)" required>
        </div>
        <div class="mb-3">
            <input name="vehicle_type" class="form-control" placeholder="Vehicle Type (e.g., Bus, Minibus)" required>
        </div>
        <div class="mb-3">
            <input name="amount" class="form-control" placeholder="Amount (BDT)" value="500" required>
        </div>
        <div class="mb-3">
            <input type="email" name="email" class="form-control" placeholder="Email" required>
        </div>
        <button type="submit" class="btn btn-success">Pay Now (Demo)</button>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
