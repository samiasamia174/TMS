<!DOCTYPE html>
<html>
<head>
    <title>Payment Receipt</title>
</head>
<body>
    <h2>✅ Payment Confirmed!</h2>
    <p>Dear {{ student_name }},</p>
    <p>Your payment of <strong>BDT {{ amount }}</strong> for {{ vehicle_type }} has been received.</p>
    <p><strong>Transaction ID:</strong> {{ transaction_id }}</p>
    <p>Thank you for using University Transport!</p>
</body>
</html>
