<!DOCTYPE html>
<html>
<head>
    <title>Bus Registration - Bus Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; cursor: pointer; }
        .nav-links { margin-top: 20px; }
        .nav-links a { display: inline-block; margin: 5px; padding: 8px 16px; background: #6c757d; color: white; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bus Registration</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Bus Number:</label>
                <input type="text" name="bus_number" required>
            </div>
            <div class="form-group">
                <label>Bus Name:</label>
                <input type="text" name="bus_name" required>
            </div>
            <div class="form-group">
                <label>Capacity:</label>
                <input type="number" name="capacity" required>
            </div>
            <button type="submit">Register Bus</button>
        </form>
        <div class="nav-links">
            <a href="/dashboard/">Dashboard</a>
            <a href="/">Home</a>
        </div>
    </div>
</body>
</html>
