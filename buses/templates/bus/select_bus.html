<!DOCTYPE html>
<html>
<head>
    <title>Select Bus - Bus Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .bus-option { background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .nav-links { margin-top: 20px; }
        .nav-links a { display: inline-block; margin: 5px; padding: 8px 16px; background: #6c757d; color: white; text-decoration: none; border-radius: 4px; }
        button { background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Select Your Bus</h1>
        <div class="bus-option">
            <h3>Express Bus #101</h3>
            <p>Route: Downtown to University</p>
            <p>Departure: 08:00 AM | Seats: 25 available</p>
            <p>Price: $5.00</p>
            <button>Select This Bus</button>
        </div>
        <div class="nav-links">
            <a href="/search-routes/">Back to Search</a>
            <a href="/dashboard/">Dashboard</a>
        </div>
    </div>
</body>
</html>
