<!DOCTYPE html>
<html>
<head>
    <title>Authority Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Authority Panel</a>
        </div>
    </nav>
    <div class="container mt-4">
        <h1>Authority Panel</h1>
        <div class="row mt-4">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Manage Buses</h5>
                        <a href="/authority/buses/" class="btn btn-primary">Go to Buses</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Manage Routes</h5>
                        <a href="/authority/routes/" class="btn btn-primary">Go to Routes</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Manage Schedules</h5>
                        <a href="/authority/schedules/" class="btn btn-primary">Go to Schedules</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">View Bookings</h5>
                        <a href="/authority/bookings/" class="btn btn-primary">View Bookings</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
