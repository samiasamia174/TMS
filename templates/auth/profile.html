<!DOCTYPE html>
<html>
<head>
    <title>User Profile - TMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
            min-height: 100vh;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="text-center mb-0">User Profile</h3>
                    </div>
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <div class="bg-primary rounded-circle d-inline-flex align-items-center justify-content-center" 
                                 style="width: 80px; height: 80px;">
                                <span class="text-white h4">{{ user.username|first|upper }}</span>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label"><strong>Username:</strong></label>
                            <p class="form-control-plaintext">{{ user.username }}</p>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label"><strong>Email:</strong></label>
                            <p class="form-control-plaintext">{{ email }}</p>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label"><strong>Member Since:</strong></label>
                            <p class="form-control-plaintext">{{ date_joined|date:"F j, Y" }}</p>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <a href="/dashboard/" class="btn btn-primary">Dashboard</a>
                            <a href="/" class="btn btn-outline-secondary">Home</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
