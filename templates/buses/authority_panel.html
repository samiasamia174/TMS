<!DOCTYPE html>
<html>
<head>
    <title>Authority Panel - TMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <nav class="mb-4">
            <a href="/dashboard/" class="btn btn-secondary">← Back to Dashboard</a>
        </nav>
        
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h3 class="mb-0">Authority Panel</h3>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <div class="card">
                            <div class="card-body text-center">
                                <h5>Manage Buses</h5>
                                <p>Add, edit, or remove buses</p>
                                <a href="/authority/buses/" class="btn btn-outline-primary">Manage</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card">
                            <div class="card-body text-center">
                                <h5>Manage Routes</h5>
                                <p>Create and modify routes</p>
                                <a href="/authority/routes/" class="btn btn-outline-success">Manage</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card">
                            <div class="card-body text-center">
                                <h5>View Bookings</h5>
                                <p>Monitor all bookings</p>
                                <a href="/authority/bookings/" class="btn btn-outline-info">View</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
