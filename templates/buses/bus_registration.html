<!DOCTYPE html>
<html>
<head>
    <title>Bus Registration - TMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <nav class="mb-4">
            <a href="/dashboard/" class="btn btn-secondary">← Back to Dashboard</a>
        </nav>
        
        <div class="card">
            <div class="card-header bg-success text-white">
                <h3 class="mb-0">Bus Registration</h3>
            </div>
            <div class="card-body">
                <form>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Bus Number</label>
                            <input type="text" class="form-control" placeholder="e.g., BUS-001">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Capacity</label>
                            <input type="number" class="form-control" placeholder="e.g., 40">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Driver Name</label>
                        <input type="text" class="form-control" placeholder="Driver's full name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Route</label>
                        <select class="form-control">
                            <option>Main Campus - City Center</option>
                            <option>North Campus - Station</option>
                            <option>South Gate - Library</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success">Register Bus</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
