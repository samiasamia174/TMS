<!DOCTYPE html>
<html>
<head>
    <title>Sign In - TMS</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 100px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; cursor: pointer; }
        .messages { color: red; margin: 10px 0; }
        .success { color: green; }
    </style>
</head>
<body>
    <h2>Sign In</h2>

    <!-- Display messages -->
    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <div class="{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <input type="text" name="username" placeholder="Username" required>
        </div>
        <div class="form-group">
            <input type="password" name="password" placeholder="Password" required>
        </div>
        <button type="submit">Sign In</button>
    </form>

    <p>Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
    <p><a href="{% url 'home' %}">Back to Home</a></p>
</body>
</html>
