<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - TMS</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; cursor: pointer; }
        .messages { color: red; margin: 10px 0; }
    </style>
</head>
<body>
    <h2>Sign Up</h2>

    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <div>{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <input type="text" name="username" placeholder="Username" required>
        </div>
        <div class="form-group">
            <input type="email" name="email" placeholder="Email" required>
        </div>
        <div class="form-group">
            <input type="password" name="password1" placeholder="Password" required>
        </div>
        <div class="form-group">
            <input type="password" name="password2" placeholder="Confirm Password" required>
        </div>
        <button type="submit">Sign Up</button>
    </form>

    <p>Already have an account? <a href="{% url 'signin' %}">Sign In</a></p>
    <p><a href="{% url 'home' %}">Back to Home</a></p>
</body>
</html>
